[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "emailtomcp"
dynamic = ["version"]
description = "로컬 메일 클라이언트 + 내장 MCP 서버 (Claude 연동)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "UTInfo" }]
dependencies = [
    "PySide6>=6.7",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "keyring>=25.0",
    "nh3>=0.2",
    "html2text>=2024.2",
    "charset-normalizer>=3.3",
    "imapclient>=3.0",
    "markdown>=3.6",
    # 업데이트 확인(§14.4): Ed25519 서명 검증, 버전 비교, OS 인증서 저장소
    "cryptography>=42",
    "packaging>=24",
    "truststore>=0.9",
    # 업데이트 매니페스트 다운로드(update/release_client.py `_load_httpx`)가 실제로 쓰는 HTTP
    # 클라이언트. mcp가 간접으로 끌어오지만, mcp 쪽 의존성이 바뀌어도 업데이트 확인이 조용히
    # "확인 불가"로 굳지 않도록 직접 의존성으로 선언한다(QA C2, 보안검토 L-6).
    "httpx2>=2.13,<3",
    # MCP 서버(§6.1): 공식 SDK v2(저수준 Server + streamable HTTP), ASGI 서버.
    # mcp 2.x는 httpx2/anyio/starlette를 함께 끌어온다(stdio 프록시 클라이언트도 httpx2 사용).
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
    # 자동회신 규칙 정규식(§7.1 M3): 선형 시간 RE2. 역참조·전후방탐색 미지원.
    "google-re2>=1.1",
    # claude -p 프로세스 트리 종료(§2(c) "실행 관리").
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=7.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "aiosmtpd>=1.4",
]
# 릴리스 빌드 전용(.github/workflows/release.yml, packaging/release/README.md).
# §15.5: PyInstaller와 Velopack 버전을 고정한다. velopack(파이썬 훅)은 vpk CLI와 같은 버전을 쓴다.
release = [
    "pyinstaller==6.22.3",
    "velopack==1.2.161",
]

[project.scripts]
emailtomcp = "emailtomcp.__main__:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "1.0.0.dev0+unknown"

[tool.hatch.build.hooks.vcs]
version-file = "src/emailtomcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/emailtomcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# hatch-vcs가 빌드/설치 시점에 생성하는 파일이다 — 손으로 고치지 않고 포맷/린트 대상에서도 뺀다.
extend-exclude = ["src/emailtomcp/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["tests/", "packaging/", "src/emailtomcp/_version.py"]

[[tool.mypy.overrides]]
module = "emailtomcp.ui.*"
check_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "unit: 외부 I/O 없는 순수 로직",
    "integration: 로컬 I/O, docker 불필요(aiosmtpd, in-process MCPServer, fake_claude)",
    "docker: GreenMail 등 docker 필요, 미가용 시 자동 skip",
    "ui: pytest-qt, QT_QPA_PLATFORM=offscreen",
    "e2e_claude: 실제 claude CLI + 로그인 필요, 옵트인",
    "slow: 1초 이상",
]
addopts = '-m "not docker and not e2e_claude and not slow" --strict-markers'
